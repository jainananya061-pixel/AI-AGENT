<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA - Rule-Based AI Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <!-- FontAwesome for modern icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
  <!-- Background decorative glow spheres -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="bg-glow glow-3"></div>

  <main class="app-container">
    <!-- Chat Card -->
    <div class="chat-card">
      
      <!-- Chat Header -->
      <header class="chat-header">
        <div class="bot-profile">
          <div class="avatar-wrapper">
            <div class="bot-avatar">
              <i class="fa-solid fa-robot"></i>
            </div>
            <span class="status-indicator online" title="Status: Online"></span>
          </div>
          <div class="bot-info">
            <div class="bot-title-row">
              <h1 class="bot-name">NEXORA</h1>
              <span class="badge">Rule-Based AI</span>
            </div>
            <p class="bot-status" id="botStatusText">Active & Ready to chat</p>
          </div>
        </div>

        <!-- Controls: Sound, Theme, Clear Chat -->
        <div class="header-actions">
          <button id="soundToggleBtn" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
            <i class="fa-solid fa-volume-high"></i>
          </button>
          <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme (Dark / Light)" aria-label="Toggle Theme">
            <i class="fa-solid fa-sun"></i>
          </button>
          <button id="clearChatBtn" class="icon-btn danger" title="Clear Chat History" aria-label="Clear Chat">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      </header>

      <!-- Message History Container -->
      <section class="chat-messages" id="chatMessages" aria-live="polite">
        <!-- Messages will be rendered dynamically here -->
      </section>

      <!-- Typing Indicator (Hidden by default) -->
      <div class="typing-indicator-container hidden" id="typingIndicator">
        <div class="typing-avatar">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="typing-bubble">
          <span class="typing-text">NEXORA is thinking</span>
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

      <!-- Quick Suggestion Chips Carousel -->
      <div class="suggestion-chips-wrapper">
        <div class="suggestion-chips-label">Quick Prompts:</div>
        <div class="suggestion-chips" id="suggestionChips">
          <button class="chip" data-prompt="What can you do?">💡 What can you do?</button>
          <button class="chip" data-prompt="Tell me a joke">😂 Tell a joke</button>
          <button class="chip" data-prompt="What time is it?">⏰ Current time</button>
          <button class="chip" data-prompt="Give me a motivation quote">✨ Daily Quote</button>
          <button class="chip" data-prompt="Tell me a riddle">🧩 Riddle</button>
          <button class="chip" data-prompt="Help">❓ Help</button>
          <button class="chip" data-prompt="Exit">👋 Exit</button>
        </div>
      </div>

      <!-- Chat Input Area -->
      <footer class="chat-footer">
        <form class="chat-input-form" id="chatForm">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="userInput" 
              placeholder="Type your message... (type 'help' for commands or 'exit' to quit)" 
              autocomplete="off"
              maxlength="500"
              required
            >
            <span class="char-counter" id="charCounter">0/500</span>
          </div>

          <div class="form-buttons">
            <button type="submit" id="sendBtn" class="send-btn" title="Send message" aria-label="Send message">
              <span>Send</span>
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </form>
        <div class="footer-note">
          <span>Continuous conversation enabled • Try saying <em>"call me &lt;your name&gt;"</em></span>
        </div>
      </footer>

      <!-- Session Ended / Exit Modal Overlay -->
      <div class="session-exit-overlay hidden" id="exitOverlay">
        <div class="exit-modal">
          <div class="exit-icon">
            <i class="fa-solid fa-door-open"></i>
          </div>
          <h2>Session Terminated</h2>
          <p id="exitMessage">You have safely exited the conversation. Thanks for chatting with NEXORA!</p>
          <div class="exit-modal-actions">
            <button id="restartChatBtn" class="btn primary-btn">
              <i class="fa-solid fa-arrow-rotate-right"></i> Start New Chat
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
